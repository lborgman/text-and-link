    <script src="./basic-ui/basic-ui-color-theme-loader.js" blocking="rendering"></script>
    <script>
        console.log("script block after color theme loader!!!!")
        const storagePrefix = "clean-link";
        globalThis.keyColorTheme = `${storagePrefix}-theme`;
        const savedTheme = retrieveTheme();
        const { color, dark, variant } = savedTheme;
        const colorTheme = globalThis.BasicUI_ColorThemes.generateTheme(color, dark, variant);
        globalThis.BasicUI_ColorThemes.applyTheme(colorTheme);
        function retrieveTheme() {
            const strJson = localStorage.getItem(keyColorTheme);
            if (strJson == null) {
                // Default theme:
                const color = "green";
                const dark = true;
                const variant = "vibrant";

                return { color, dark, variant }
            }
            const objJson = JSON.parse(strJson)
            return objJson;
        }
    </script>
