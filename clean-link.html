    <script>
        const storagePrefix = "clean-link";
        globalThis.keyColorTheme = `${storagePrefix}-theme`;
        const savedTheme = retrieveTheme();
        const { color, dark, variant } = savedTheme;
        const colorTheme = globalThis.BasicUI_ColorThemes.generateTheme(color, dark, variant);
        globalThis.BasicUI_ColorThemes.applyTheme(colorTheme);
        function retrieveTheme() {
            const strJson = localStorage.getItem(keyColorTheme);
            if (strJson == null) {
                // Default theme:
                const color = "green";
                const dark = true;
                const variant = "vibrant";

                return { color, dark, variant }
            }
            const objJson = JSON.parse(strJson)
            return objJson;
        }
    </script>

    <style id="native-radio">

/* ==========================================================================
   Native radio
   ========================================================================== */

label:has(> input[type="radio"]) {
    --_size: 1.5rem;

    position: relative;
    display: inline-flex;
    align-items: center;
    min-block-size: var(--_size);
    padding-inline-start: calc(var(--_size) + 0.25rem);
    cursor: pointer;
}


/* Hide the native radio, but keep it functional */

label:has(> input[type="radio"]) > input {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    opacity: 0;
}


/* Radio icon */

label:has(> input[type="radio"])::before {
    content: "radio_button_unchecked";

    position: absolute;
    inset-inline-start: 0;
    inset-block-start: 50%;
    transform: translateY(-50%);

    inline-size: var(--_size);
    block-size: var(--_size);

    font-family: var(--font-icon);
    font-weight: normal;
    font-style: normal;
    font-size: var(--_size);
    line-height: 1;

    letter-spacing: normal;
    text-transform: none;
    font-feature-settings: "liga";
    -webkit-font-smoothing: antialiased;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    color: var(--primary);

    user-select: none;
}


/* Checked */

label:has(> input[type="radio"]:checked)::before {
    content: "radio_button_checked";
}


/* Disabled */

label:has(> input[type="radio"]:disabled) {
    opacity: 0.5;
    cursor: not-allowed;
}


/* Focus */

label:has(> input[type="radio"]:focus-visible)::before {
    outline: 0.125rem solid var(--primary);
    outline-offset: 0.375rem;
}


/* Hover / focus ripple */

label:has(> input[type="radio"])::after {
    content: "";

    position: absolute;
    inset-inline-start: 0;
    inset-block-start: 50%;
    transform: translateY(-50%);

    inline-size: var(--_size);
    block-size: var(--_size);

    border-radius: 50%;

    background-color: currentColor;
    box-shadow: 0 0 0 0 currentColor;
    opacity: 0;

    transition: all var(--speed1);

    pointer-events: none;
}

label:has(> input[type="radio"]:not(:disabled)):hover::after,
label:has(> input[type="radio"]:not(:disabled):focus)::after {
    box-shadow: 0 0 0 0.5rem currentColor;
    opacity: 0.1;
}

    </style>

    <style id="native-checkbox">
        /* ==========================================================================
   Native checkbox
   ========================================================================== */

        /*
 * Beer CSS:
 *
 * <label class="checkbox">
 *     <input type="checkbox">
 *     <span>Checkbox</span>
 * </label>
 *
 * Beer Native:
 *
 * <label>
 *     <input type="checkbox">
 *     <span>Checkbox</span>
 * </label>
 */

        label:has(> input[type="checkbox"]) {
            --_size: 1.5rem;
            inline-size: auto;
            block-size: auto;
            line-height: normal;
            white-space: nowrap;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        label:has(> input[type="checkbox"]).small {
            --_size: 1rem;
        }

        label:has(> input[type="checkbox"]).large {
            --_size: 2rem;
        }

        label:has(> input[type="checkbox"]).extra {
            --_size: 2.5rem;
        }

        label:has(> input[type="checkbox"])>input {
            inline-size: var(--_size);
            block-size: var(--_size);
            opacity: 0;
        }

        label:has(> input[type="checkbox"])>span {
            display: inline-flex;
            align-items: center;
            color: var(--on-surface);
            font-size: 0.875rem;
            min-inline-size: 0.25rem;
            min-block-size: 0.25rem;
        }

        label:has(> input[type="checkbox"])>span:not(:empty) {
            padding-inline-start: 0.25rem;
        }


        /* Material Symbols styling */

        label:has(> input[type="checkbox"])>span::before {
            --_size: inherit;

            content: "";
            font-family: var(--font-icon);
            font-weight: normal;
            font-style: normal;
            font-size: var(--_size);
            letter-spacing: normal;
            text-transform: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            font-feature-settings: "liga";
            -webkit-font-smoothing: antialiased;
            vertical-align: middle;
            text-align: center;
            overflow: hidden;
            inline-size: var(--_size);
            min-inline-size: var(--_size);
            block-size: var(--_size);
            min-block-size: var(--_size);
            box-sizing: content-box;
            line-height: normal;
            border-radius: 0;

            position: absolute;
            inset: auto auto auto calc(var(--_size, 0) * -1);

            color: var(--primary);
            user-select: none;
            z-index: 1;
        }

        [dir="rtl"] label:has(> input[type="checkbox"])>span::before {
            inset: auto calc(var(--_size, 0) * -1) auto auto;
        }


        /* Checkbox icon states */

        label:has(> input[type="checkbox"])>span::before {
            content: "check_box_outline_blank";
        }

        label:has(> input[type="checkbox"])>input:checked+span::before {
            content: "check_box";
            font-variation-settings: "FILL" 1;
        }

        label:has(> input[type="checkbox"])>input:indeterminate+span::before {
            content: "indeterminate_check_box";
        }


        /* Ripple / hover / focus */

        label:has(> input[type="checkbox"])>span::after {
            --_size: inherit;

            content: "";
            inline-size: var(--_size);
            block-size: var(--_size);
            box-sizing: border-box;
            margin: 0 auto;
            outline: none;
            position: absolute;
            inset: auto auto auto calc(var(--_size, 0) * -1);
            border-radius: 50%;
            user-select: none;
            z-index: 1;

            transition: all var(--speed1);
            background-color: currentColor;
            box-shadow: 0 0 0 0 currentColor;
            opacity: 0;
        }

        [dir="rtl"] label:has(> input[type="checkbox"])>span::after {
            inset: auto calc(var(--_size, 0) * -1) auto auto;
        }

        label:has(> input[type="checkbox"]):is(:hover)>input:not(:disabled)+span::after,
        label:has(> input[type="checkbox"])>input:not(:disabled):is(:focus)+span::after {
            box-shadow: 0 0 0 0.5rem currentColor;
            opacity: 0.1;
        }


        /* Checked / disabled / focus */

        label:has(> input[type="checkbox"])>input:checked+span::before {
            color: var(--primary);
        }

        label:has(> input[type="checkbox"])>input:disabled+span {
            opacity: 0.5;
            cursor: not-allowed;
        }

        label:has(> input[type="checkbox"])>input:focus-visible+span::before {
            outline: 0.125rem solid var(--primary);
            outline-offset: 0.375rem;
        }
    </style>
