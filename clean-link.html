    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            color: white;
            background-color: black;
        }


        .expandable-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            /* Starts at collapsed height */
            transition: grid-template-rows 0.5s ease-out;
            /* Controls the slow change */
        }

        /* Trigger this class when content is added */
        .expandable-wrapper.expanded {
            grid-template-rows: 1fr;
            /* Safely expands to fit content smoothly */
        }

        .expandable-content {
            overflow: hidden;
            /* Prevents text from spilling out during animation */
        }


        a {
            color: blue;
            color: lightblue;
        }

        div.mw-parser-output a {
            color: blue;
        }

        section#main-section {
            max-width: clamp(300px, 90vw, 600px);
            margin-left: auto;
            margin-right: auto;
        }

        #ta-link {
            width: 100%;
            min-height: 60px;
            margin-top: 4px;
            field-sizing: content;
        }



        #logo {
            width: 60px;
            height: 60px;
            background-image: url(./clean-link.svg);
            background-size: contain;
            background-repeat: no-repeat;
            cursor: pointer;
            position: relative;
        }

        #logo-info {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: white;
            background-image: url(./info.svg);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        #logo:hover::after {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            content: "";
            background-color: #f005;
        }


        #header-title {
            font-size: 25px;
            color: lightblue;
        }


        #NOdiv-output {
            display: grid;
            grid-template-columns: 1fr fit-content(50px);
            gap: 20px;
            padding: 10px;
        }

        #NOtext-content {
            overflow-wrap: anywhere;
        }

        #clean-this-link>div {
            margin-bottom: 3px;
        }

        #cleaned-info {
            height: 2rem;
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
        }

        #div-cleaned-details {
            font-style: italic;
            padding-left: 2rem;
        }


        #output {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px;
            border: 1px solid gray;
            border-radius: 4px;
        }

        #main-header {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-around;
        }


        /* FIX-ME: */
        dialog#can-be-installed {
            display: none !important;
            /* background-color: lightblue; */
            /* color: black; */
            padding: 15px;
            padding-top: 30px;

            border-radius: 15px;

            a {
                color: darkblue;
            }
        }

        .is-android.pwa-is-not-installed #can-be-installed {
            display: block !important;
        }

        [nOpopover]:popover-open {
            display: block;
            position: fixed;
            padding: 10px;
            border-radius: 10px;
            border: none;
            outline: 2px solid blue;
            background-color: white;
            color: blue;
        }


        .show-here {
            max-width: 150px;
        }

        #tell-open-link {
            transition: opacity linear;
            opacity: 1;
        }



        /*********************************/
        /** basic-ui.js, basic-ui.css ****/
        /*********************************/

        :root {
            --snackbar-exit-duration: 0.6s;
            --snackbar-exit-duration: 500ms;
            --snackbar-exit-duration: 2s;

            --snackbar-entry-duration: 4s;
            --snackbar-entry-duration: 0.5s;

            /* --ripple-duration: 6000ms; */
            --snackbar-hidden-bg: red;
            --snackbar-visible-bg: yellow;
            --snackbar-color: red;
            --snackbar-color: black;
        }

        /* ////////////////// Below is suggestions from full Gemini and ChatGPT.  */


        #snackbarOLD {
            position: fixed;
            top: auto;
            bottom: 2rem;
            left: 2rem;
            right: auto;
            margin: 0;

            max-width: clamp(160px, 400px, calc(100dvw - 4rem));
            overflow-wrap: anywhere;

            border-radius: 10px;
            border: 2px solid;
            color: blue;

            box-shadow: 0 0 20px 4px var(--snackbar-visible-bg);

            /* Closed: completely below viewport */
            transform: translateY(calc(100% + 2rem));
            opacity: 0;
            background-color: var(--snackbar-hidden-bg);

            transition:
                transform var(--snackbar-entry-duration) cubic-bezier(0.3, 0, 1, 1),
                opacity var(--snackbar-entry-duration) linear,
                background-color var(--snackbar-entry-duration) ease,
                display var(--snackbar-entry-duration) ease,
                overlay var(--snackbar-entry-duration) ease;

            transition-behavior: allow-discrete;
        }

        #snackbarOLD:popover-open {
            /* Open: bottom: 2rem determines the position */
            transform: translateY(0);
            opacity: 1;
            background-color: var(--snackbar-visible-bg);

            @starting-style {
                /* Start completely below viewport */
                transform: translateY(calc(100% + 2rem));
                opacity: 0;
                /* background-color: red; */
                background-color: var(--snackbar-visible-bg);
            }
        }

        #snackbar {
            background-color: var(--inverse-surface) !important;
            color: contrast-color(var(--inverse-surface)) !important;
        }


        #popover:popover-open {
            top: auto;
            bottom: 2rem;
            left: 2rem;
            right: auto;
            margin: 0;

            opacity: 0;
            transform: translateY(0);

            transition-property: transform, opacity, display, overlay;
            transition-duration: var(--snackbar-exit-duration);
            transition-timing-function: cubic-bezier(0.05, 0.7, 0.1, 1), linear, ease, ease;
            transition-behavior: allow-discrete;
        }

        /* 5. Entry Starting Frame State */

        button {
            position: relative;
            overflow: hidden;
        }

        /*
        :root {
            --button-bg-color: lightblue;
            --button-bg-color: white;
            --button-bg-color: orange;
            --button-bg-color: #87cefa;
            --button-bg-color: #6200ee;
        }
        */

        button {
            position: relative;
            overflow: hidden;
            /* transition: background 400ms; */
            /* color: #fff; */
            /* color: contrast-color(var(--button-bg-color)); */
            /* background-color: var(--button-bg-color); */
            padding: 0.7rem 1rem;
            /* font-family: 'Roboto', sans-serif; */
            font-size: 1rem;
            outline: 0;
            border: 0;
            border-radius: 0.25rem;
            box-shadow: 0 0 0.5rem rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        span.ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            /* animation: ripple 6000ms linear; */
            animation: ripple var(--ripple-duration) linear;
            background-color: color-mix(in srgb, contrast-color(var(--button-bg-color)) 70%, transparent);
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }






        /* One rule handles contrast for every role */
        button,
        [class*="bg-"] {
            background-color: var(--bg);
            color: contrast-color(var(--bg));
        }

        button {
            --bg: var(--secondary);
            --bg: var(--tertiary);
            --bg: var(--primary);
        }

        /* Modifier classes just point --bg at a token */
        .bg-primary {
            --bg: var(--primary);
        }

        .bg-primary-container {
            --bg: var(--primary-container);
        }

        .bg-secondary {
            --bg: var(--secondary);
        }

        .bg-secondary-container {
            --bg: var(--secondary-container);
        }

        .bg-tertiary {
            --bg: var(--tertiary);
        }

        .bg-tertiary-container {
            --bg: var(--tertiary-container);
        }

        .bg-error {
            --bg: var(--error);
        }

        .bg-error-container {
            --bg: var(--error-container);
        }

        .bg-surface {
            --bg: var(--surface);
        }

        .bg-surface-variant {
            --bg: var(--surface-variant);
        }

        .bg-background {
            --bg: var(--background);
        }
    </style>
