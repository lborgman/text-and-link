<head>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            color: white;
            background-color: black;
            font-family: Arial;
        }


        .expandable-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            /* Starts at collapsed height */
            transition: grid-template-rows 0.5s ease-out;
            /* Controls the slow change */
        }

        /* Trigger this class when content is added */
        .expandable-wrapper.expanded {
            grid-template-rows: 1fr;
            /* Safely expands to fit content smoothly */
        }

        .expandable-content {
            overflow: hidden;
            /* Prevents text from spilling out during animation */
        }


        a {
            color: lightblue;
        }

        section#main-section {
            max-width: clamp(300px, 90vw, 600px);
            margin-left: auto;
            margin-right: auto;
        }

        #ta-link {
            width: 100%;
            min-height: 60px;
            margin-top: 4px;
            field-sizing: content;
        }



        #logo {
            width: 60px;
            height: 60px;
            background-image: url(./clean-link.svg);
            background-size: contain;
            background-repeat: no-repeat;
            cursor: pointer;
        }

        #logo-info {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            /* outline: 2px dotted red; */
            background-color: white;
            background-image: url(./info.svg);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }


        #header-title {
            font-size: 25px;
            color: lightblue;
        }


        #NOdiv-output {
            display: grid;
            grid-template-columns: 1fr fit-content(50px);
            gap: 20px;
            padding: 10px;
        }

        #NOtext-content {
            overflow-wrap: anywhere;
        }

        #clean-this-link>div {
            margin-bottom: 3px;
        }

        #cleaned-info {
            height: 2rem;
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
        }

        #div-cleaned-details {
            font-style: italic;
            padding-left: 2rem;
        }


        #output {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px;
            border: 1px solid gray;
            border-radius: 4px;
        }

        #main-header {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-around;
        }


        /* FIX-ME: */
        dialog#can-be-installed {
            display: none !important;
            background-color: lightblue;
            color: black;
            padding: 15px;
            padding-top: 30px;
            /* margin: 20px 0; This breaks centering the dialog! */
            border-radius: 15px;

            a {
                color: darkblue;
            }
        }

        .is-android.pwa-is-not-installed #can-be-installed {
            display: block !important;
        }

        [popover]:popover-open {
            display: block;
            position: fixed;
            padding: 10px;
            border-radius: 10px;
            border: none;
            outline: 2px solid blue;
            background-color: white;
            color: blue;
        }

        .snackbar {
            max-width: clamp(160px, 400px, 70dvw);
            outline-color: yellow;
            box-shadow: 0px 0px 20px 4px yellow;
        }

        .show-here {
            max-width: 150px;
        }

        #tell-open-link {
            transition: opacity linear;
            opacity: 1;
        }



        /*********************************/
        /** basic-ui.js, basic-ui.css ****/
        /*********************************/

        :root {
            --snack-trans-dur: 0.6s;
            --snack-trans-dur: 500ms;
            /* --ripple-duration: 6000ms; */
        }

        /* ////////////////// Below is suggestions from full Gemini.  */
        #snackbar-popover {
            /* 1. Base positioning & resets */
            position: fixed;
            top: auto;
            bottom: 2rem;
            left: 2rem;
            right: auto;
            margin: 0;
            max-width: clamp(160px, 400px, calc(100dvw - 4rem));

            /* 2. Closed / Exit target state */
            opacity: 0;
            transform: translateY(-calc(100% + 2rem));

            /* 3. Exit Transition */
            transition-property: transform, opacity, display, overlay;
            /* transition-duration: 0.5s; */
            transition-duration: var(--snack-trans-dur);
            transition-timing-function: cubic-bezier(0.3, 0, 1, 1), linear, ease, ease;
            transition-behavior: allow-discrete;
        }

        /* 4. Active Open State */
        #snackbar-popover:popover-open {
            top: auto;
            bottom: 2rem;
            left: 2rem;
            right: auto;
            margin: 0;

            opacity: 1;
            transform: translateY(0);

            /* Entry Transition - overriding only the timing functions */
            transition-property: transform, opacity, display, overlay;
            NOtransition-duration: 4.5s;
            transition-timing-function: cubic-bezier(0.05, 0.7, 0.1, 1), linear, ease, ease;
            transition-behavior: allow-discrete;
        }

        /* 5. Entry Starting Frame State */
        @starting-style {
            #snackbar-popover:popover-open {
                opacity: 0;
                transform: translateY(calc(100% + 2rem));
            }
        }

        button {
            position: relative;
            overflow: hidden;
        }

        :root {
            --button-bg-color: #6200ee;
            --button-bg-color: lightblue;
            --button-bg-color: white;
            --button-bg-color: orange;
            --button-bg-color: #87cefa;
        }
        button {
            position: relative;
            overflow: hidden;
            transition: background 400ms;
            color: #fff;
            color: contrast-color(var(--button-bg-color));
            background-color: var(--button-bg-color);
            padding: 0.7rem 1rem;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            outline: 0;
            border: 0;
            border-radius: 0.25rem;
            box-shadow: 0 0 0.5rem rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        span.ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            /* animation: ripple 6000ms linear; */
            animation: ripple var(--ripple-duration) linear;
            background-color: color-mix(in srgb, contrast-color(var(--button-bg-color)) 70%, transparent);
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
