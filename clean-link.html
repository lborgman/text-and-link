<!DOCTYPE html>
<html lang="en">
<!-- https://collegeinfogeek.com/spaced-repetition-memory-technique/ -->

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- This page © Copyright 2026, Lennart Borgman -->
    <meta name="author" content="Lennart Borgman">
    <meta name="description" content="Clean link from click ids. Get shared text and link">
    <meta name="theme-color" content="#c0ca33">

    <link rel="preconnect" href="https://lborgman.github.io" crossorigin />

    <script src="./init-error-new.js"></script>

    <title>Text+Link</title>

    <link rel="icon" type="image/svg+xml" href="./clean-link.svg">
    <link rel="manifest" href="./manifest.json">

    <script src="clean-link.js" type="module"></script>
    <!-- <script src="https://github.com/lborgman/speech-kb/blob/main/js/mod/basic-ui.js" type="module"></script> -->
    <script src="https://lborgman.github.io/speech-kb/js/mod/basic-ui.js" type="module"></script>

    <!-- Asynchronous non-blocking CSS load -->
    <link rel="stylesheet" href="https://lborgman.github.io/speech-kb/js/mod/basic-ui.css" media="print"
        onload="this.media='all'" />

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            color: white;
            background-color: black;
            font-family: Arial;
        }


        .expandable-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            /* Starts at collapsed height */
            transition: grid-template-rows 0.5s ease-out;
            /* Controls the slow change */
        }

        /* Trigger this class when content is added */
        .expandable-wrapper.expanded {
            grid-template-rows: 1fr;
            /* Safely expands to fit content smoothly */
        }

        .expandable-content {
            overflow: hidden;
            /* Prevents text from spilling out during animation */
        }


        a {
            color: lightblue;
        }

        section#main-section {
            max-width: clamp(300px, 90vw, 600px);
            margin-left: auto;
            margin-right: auto;
        }

        #ta-link {
            width: 100%;
            min-height: 60px;
            margin-top: 4px;
            field-sizing: content;
        }



        #logo {
            width: 60px;
            height: 60px;
            background-image: url(./clean-link.svg);
            background-size: contain;
            background-repeat: no-repeat;
            cursor: pointer;
        }

        #logo-info {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            /* outline: 2px dotted red; */
            background-color: white;
            background-image: url(./info.svg);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }


        #header-title {
            font-size: 25px;
            color: lightblue;
        }


        #NOdiv-output {
            display: grid;
            grid-template-columns: 1fr fit-content(50px);
            gap: 20px;
            padding: 10px;
        }

        #NOtext-content {
            overflow-wrap: anywhere;
        }

        #clean-this-link>div {
            margin-bottom: 3px;
        }

        #cleaned-info {
            height: 2rem;
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
        }

        #div-cleaned-details {
            font-style: italic;
            padding-left: 2rem;
        }


        #output {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px;
            border: 1px solid gray;
            border-radius: 4px;
        }

        #main-header {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-around;
        }


        /* FIX-ME: */
        dialog#can-be-installed {
            display: none !important;
            background-color: lightblue;
            color: black;
            padding: 15px;
            padding-top: 30px;
            /* margin: 20px 0; This breaks centering the dialog! */
            border-radius: 15px;

            a {
                color: darkblue;
            }
        }

        .is-android.pwa-is-not-installed #can-be-installed {
            display: block !important;
        }

        [popover]:popover-open {
            display: block;
            position: fixed;
            padding: 10px;
            border-radius: 10px;
            border: none;
            outline: 2px solid blue;
            background-color: white;
            color: blue;
        }

        .snackbar {
            max-width: clamp(160px, 400px, 70dvw);
            outline-color: yellow;
            box-shadow: 0px 0px 20px 4px yellow;
        }

        .show-here {
            max-width: 150px;
        }

        #tell-open-link {
            transition: opacity linear;
            opacity: 1;
        }




        /*********************************/
        /** basic-ui.js, basic-ui.css ****/
        /*********************************/

        /****** dialog ******/
        dialog {
            position: relative;
            border: 1px solid gray;
            border-radius: 8px;
            /* padding: 0; */
            background-color: palegoldenrod;
            max-width: calc(min(500px, 90vw));
            opacity: 0;
            transition-property: opacity, display, overlay;
            transition-duration: 2s;
            transition-behavior: allow-discrete;

            /* transition-delay: 2s; */
            a {
                color: blue;
            }
        }

        dialog:modal {
            /* CRITICAL FIX: Overrides the browser's native 'display: block' rule */
            display: flex !important;
            flex-direction: column;
        }

        dialog:modal .modal-scroll-body {
            flex: 1 1 auto;
            overflow-y: auto;

            /* CRITICAL: Smooth out mobile touch scroll physics */
            /* -webkit-overflow-scrolling: touch; */
        }

        dialog[open] {
            opacity: 1;
        }

        /* Starting styles for entering */
        /* @starting-style { dialog[open] { opacity: 0; } } */

        /* CRITICAL: Change transition ONLY when closing */
        dialog:not([open]) {
            transition-duration: 0.4s !important;
        }

        dialog::backdrop {
            background-color: transparent;
            backdrop-filter: blur(0px);
            transition-property: background-color, backdrop-filter;
            transition-duration: 2s;
        }

        dialog[open]::backdrop {
            background-color: #0008;
            backdrop-filter: blur(2px);
        }

        .x-close {
            /* background: none; */
            background-color: #44f7;
            border: none;
            outline: none;
            box-shadow: none;
            position: absolute;
            right: 0;
            top: 0;
            width: 32px;
            aspect-ratio: 1 / 1;
        }

        .x-close:hover {
            background-color: red;
        }
    </style>
</head>

<body>
    <header id="main-header">
        <!-- <p id="logo"> <img src="./clean-link.svg" height="100" /> </p> -->
        <div id="logo" title="- Help">
            <div id="logo-info"></div>
        </div>
        <span>
            <span id="header-title">Clean Link</span>
        </span>
    </header>
    <section id="main-section">

        <label id="clean-this-link">
            <div>
                Clean link from
                <a nohref="https://en.wikipedia.org/wiki/Click_identifier"
                    onclick="showWikipediaAsDialog('Click_identifier')" style="text-decoration:underline;">click
                    identifiers</a>:
            </div>
            <textarea type="text" id="ta-link" placeholder="Link to clean"></textarea>
        </label>
        <div id="cleaned-info">
        </div>
        <div id="output" style="visibility: hidden;">
            <div>
                <div id="output-text"></div>
                <div id="output-link"></div>
            </div>
            <div>
                <button id="btn-copy">Copy</button>
            </div>
        </div>

    </section>
    <dialog id="can-be-installed" class="html-dialog">
        <div>
            <h3>This web page can do more!</h3>
            <p>
                It looks like you are using an Android mobile or tablet.
            </p>
            <p>
                On Android this web page can be a "share target" for apps and web pages.
            </p>
            <p>
                <button onclick="
                    event.preventDefault();
                    const t = event.target;
                    const dlg = t.closest('dialog');

                    console.log({dlg});
                    // dlg.close();
                    dlg.remove();
                    showHelp();
                    // showWikipediaAsDialog(`Progressive_web_app`);
                    ">Tell me more</button>

            </p>
        </div>
    </dialog>

</body>

</html>
