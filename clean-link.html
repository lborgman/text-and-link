        .expandable-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            /* Starts at collapsed height */
            transition: grid-template-rows 0.5s ease-out;
            /* Controls the slow change */
        }

        /* Trigger this class when content is added */

            /* Safely expands to fit content smoothly */

        /*********************************/
        /** basic-ui.js, basic-ui.css ****/
        /*********************************/

        :root {
            --snackbar-exit-duration: 0.6s;
            --snackbar-exit-duration: 500ms;
            --snackbar-exit-duration: 2s;

            --snackbar-entry-duration: 4s;

            /* --ripple-duration: 6000ms; */
            /* --snackbar-hidden-bg: red; */
            /* --snackbar-visible-bg: yellow; */
        }



        /* ////////////////// Below is suggestions from full Gemini and ChatGPT.  */


        #popover:popover-open {
            top: auto;
            bottom: 2rem;
            left: 2rem;
            right: auto;
            margin: 0;

            opacity: 0;
            transform: translateY(0);

            transition-property: transform, opacity, display, overlay;
            transition-duration: var(--snackbar-exit-duration);
            transition-timing-function: cubic-bezier(0.05, 0.7, 0.1, 1), linear, ease, ease;
            transition-behavior: allow-discrete;
        }

        /* 5. Entry Starting Frame State */

        button {
            position: relative;
            overflow: hidden;
        }



        button {
            position: relative;
            overflow: hidden;
            /* transition: background 400ms; */
            /* color: #fff; */
            /* color: contrast-color(var(--button-bg-color)); */
            /* background-color: var(--button-bg-color); */
            padding: 0.7rem 1rem;
            /* font-family: 'Roboto', sans-serif; */
            font-size: 1rem;
            outline: 0;
            border: 0;
            border-radius: 0.25rem;
            box-shadow: 0 0 0.5rem rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        span.ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            /* animation: ripple 6000ms linear; */
            animation: ripple var(--ripple-duration) linear;
            /* background-color: color-mix(in srgb, contrast-color(var(--button-bg-color)) 70%, transparent); */
            background-color: color-mix(in srgb, contrast-color(var(--primary)) 70%, transparent);
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }






        /* One rule handles contrast for every role */
        button,
        [class*="bg-"] {
            background-color: var(--bg);
            color: contrast-color(var(--bg));
        }

        button {
            --bg: var(--secondary);
            --bg: var(--tertiary);
            --bg: var(--primary);
        }

        /* Modifier classes just point --bg at a token */
        .bg-primary {
            --bg: var(--primary);
        }

        .bg-primary-container {
            --bg: var(--primary-container);
        }

        .bg-secondary {
            --bg: var(--secondary);
        }

        .bg-secondary-container {
            --bg: var(--secondary-container);
        }

        .bg-tertiary {
            --bg: var(--tertiary);
        }

        .bg-tertiary-container {
            --bg: var(--tertiary-container);
        }

        .bg-error {
            --bg: var(--error);
        }

        .bg-error-container {
            --bg: var(--error-container);
        }

        .bg-surface {
            --bg: var(--surface);
        }

        .bg-surface-variant {
            --bg: var(--surface-variant);
        }

        .bg-background {
            --bg: var(--background);
        }


        html,
        body {
            background-color: var(--surface) !important;
            color: var(--on-surface);
        }



        /* ==========================================================================
   Links & Typography
   ========================================================================== */

        /* Links use Primary color with clear focus/hover feedback */
        a {
            /* color: var(--primary); */
            color: var(--link-color);
            text-decoration-color: var(--link-color);
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        a:hover {
            /* color: var(--secondary); */
            color: var(--link-hover);
        }


        /* 1. Hide the outline on mouse click for native buttons and links */
        button:focus,
        a:focus {
            outline: none;
        }

        /* 2. Apply your custom styling only during keyboard navigation */
        button:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
            border-radius: 3px;
        }

        /* ==========================================================================
   Native <dialog> & Backdrops
   ========================================================================== */

        dialog {
            background-color: var(--surface);
            color: contrast-color(var(--surface));
            border: 1px solid var(--outline-variant);
            border-radius: 28px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1),
                0 8px 10px -6px rgba(0, 0, 0, 0.1);
            /* max-width: clamp(300px, 100dvw - 2rem, 550px); */
            width: calc(100dvw - 1rem);
            max-width: 550px;
        }

        /* Backdrop behind the dialog */
        dialog[open]::backdrop {
            /* background-color: rgba(0, 0, 0, 0.32); */
            /* background-color: var(--backdrop, "red"); */
            /* background-color: "red"; */
            backdrop-filter: blur(2px);
        }

        /* ==========================================================================
   Form Controls (<input>, <select>, <textarea>)
   ========================================================================== */

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select,
        textarea {
            background-color: var(--surface-variant);
            color: contrast-color(var(--surface-variant));
            border: 1px solid var(--outline);
            border-radius: 8px;
            padding: 0.625rem 0.875rem;
            font-size: 1rem;
            transition: border-color 0.15s ease;
        }

        /* Focused State */
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        /* Checkboxes & Radio Buttons */
        input[type="checkbox"],
        input[type="radio"] {
            accent-color: var(--primary);
        }

        /* ==========================================================================
   Buttons (<button>)
   ========================================================================== */

        /* Filled Primary Button */
        button,
        input[type="submit"] {
            background-color: var(--primary);
            color: contrast-color(var(--primary));
            border: none;
            border-radius: 9999px;
            /* Pill shape */
            padding: 0.625rem 1.25rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Outlined / Secondary Button Variant */
        button.secondary {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--outline);
        }

        /* ==========================================================================
   Other Common Native Elements
   ========================================================================== */

        /* Structural Dividers */
        hr {
            border: none;
            border-top: 1px solid var(--outline-variant);
            margin: 1.5rem 0;
        }

        /* Code Blocks */
        code,
        pre {
            /* background-color: var(--surface-variant); */

            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;

            overflow-x: auto;
        }

        #snackbar {

            border: solid 0.1px #0003;

        /** Icon buttons */
        :root {
            --md-btn-size-default: 40px;
            --md-icon-size-default: 24px;
        }

        .md-icon-button {
            --btn-size: var(--md-btn-size-default);
            --icon-size: var(--md-icon-size-default);

            --touch-target-size: max(48px, var(--btn-size));

            position: relative;
            width: var(--btn-size);
            height: var(--btn-size);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            padding: 0;
            outline: none;
            overflow: visible;
        }

        @media (pointer: coarse) {
            .md-icon-button::after {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                width: var(--touch-target-size);
                height: var(--touch-target-size);
                transform: translate(-50%, -50%);
                border-radius: 50%;
                outline: 1px dotted red;
            }
        }

        /* --- 3. THE SIZE MODIFIER CLASSES (Just override variables!) --- */
        .md-icon-button.md-xs {
            --btn-size: 32px;
            --icon-size: 18px;
        }

        /* .md-s matches the :root defaults, no extra code needed unless you want it explicit */
        .md-icon-button.md-s {
            --btn-size: 40px;
            --icon-size: 24px;
        }

        .md-icon-button.md-m {
            --btn-size: 56px;
            --icon-size: 28px;
        }

        .md-icon-button.md-l {
            --btn-size: 96px;
            --icon-size: 48px;
        }

        .md-icon-button.md-xl {
            --btn-size: 136px;
            --icon-size: 64px;

        /* @media (pointer: fine) { */
        .md-icon-button:hover {
            background-color: rgba(73, 69, 79, 0.08);
            background-color: green;
        }

        /* } */

        .md-icon-button svg {
            width: var(--icon-size);
            height: var(--icon-size);
            fill: currentColor;
            pointer-events: none;
        }
