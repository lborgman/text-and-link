<!DOCTYPE html>
<html lang="en">
<!-- https://collegeinfogeek.com/spaced-repetition-memory-technique/ -->

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- This page © Copyright 2026, Lennart Borgman -->
    <meta name="author" content="Lennart Borgman">
    <meta name="description" content="Clean link from click ids. Get shared text and link">
    <meta name="theme-color" content="#c0ca33">

    <script src="./init-error-new.js"></script>

    <title>Text+Link</title>
    <link rel="icon" type="image/svg+xml" href="./tl.svg">
    <link rel="manifest" href="./manifest.json">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            color: white;
            background-color: black;
            font-family: Arial;
        }


        .expandable-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            /* Starts at collapsed height */
            transition: grid-template-rows 0.5s ease-out;
            /* Controls the slow change */
        }

        /* Trigger this class when content is added */
        .expandable-wrapper.expanded {
            grid-template-rows: 1fr;
            /* Safely expands to fit content smoothly */
        }

        .expandable-content {
            overflow: hidden;
            /* Prevents text from spilling out during animation */
        }


        a {
            color: lightblue;
        }

        section#main-section {
            max-width: clamp(300px, 90vw, 600px);
            margin-left: auto;
            margin-right: auto;
            outline: 1px dotted red;
        }

        #ta-link {
            width: 100%;
            min-height: 60px;
            margin-top: 4px;
            field-sizing: content;
        }

        #info-header {
            display: flex;
            align-items: flex-end;
        }
        #header-title {
            font-size: 25px;
            color: lightblue;
        }


        #NOdiv-output {
            display: grid;
            grid-template-columns: 1fr fit-content(50px);
            gap: 20px;
            padding: 10px;
        }

        #NOtext-content {
            overflow-wrap: anywhere;
        }

        #clean-this-link>div {
            margin-bottom: 3px;
        }

        #cleaned-info {
            height: 2rem;
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
        }

        #div-cleaned-details {
            font-style: italic;
            padding-left: 2rem;
        }


        #output {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px;
            border: 1px solid gray;
            border-radius: 4px;
        }

        #main-header {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-around;
        }


        /* FIX-ME: */
        .pwa-is-installed #can-be-installed {
            outline: 4px dotted green;
        }

        .pwa-is-not-installed #can-be-installed {
            outline: 4px dotted red;
        }
    </style>
</head>

<body>
    <header id="main-header">
        <p id="info-header"> <img src="./tl.svg" height="100" /> </p>
        <span>
            <span id="header-title">Text+Link</span>
        </span>
    </header>
    <section id="main-section">
        <label id="clean-this-link">
            <div>
                Clean link from
                <a href="https://en.wikipedia.org/wiki/Click_identifier">click identifiers</a>:
            </div>
            <textarea type="text" id="ta-link" placeholder="Link to clean"></textarea>
        </label>
        <div id="cleaned-info">
        </div>
        <div id="output">
            <div>
                <div id="output-text"></div>
                <div id="output-link"></div>
            </div>
            <div>
                <button id="btn-copy">Copy</button>
            </div>
        </div>

        <p id="can-be-installed">
            This web page can be a share target for apps and web pages.
            It must be "installed as a
            <a href="https://en.wikipedia.org/wiki/Progressive_web_app">PWA</a>
            " in your web browser.
            (There is only support for this on Android mobiles yet.)
        </p>
    </section>
    <script src="text-and-link.js"></script>

</body>

</html>
