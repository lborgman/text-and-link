    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            color: white;
            background-color: black;
            font-family: Arial;
        }

        a {
            color: lightblue;
        }

        section#main-section {
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            outline: 1px dotted red;
        }

        #ta-link {
            width: 100%;
            margin-top: 4px;
        }

        #info-header {
            display: flex;
            align-items: flex-end;
        }


        #div-output {
            display: grid;
            grid-template-columns: 1fr fit-content(50px);
            gap: 20px;
            padding: 10px;
        }

        #text-content {
            overflow-wrap: anywhere;
        }

        #main-header {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-around;
        }
        }
